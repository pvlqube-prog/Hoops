name: Build QUBE 2K23 Launcher

on:
  push:
    branches: [main, feature/qube-2k23-launcher]
    paths:
      - "Launcher/**"
      - ".github/workflows/build-qube-launcher.yml"
  pull_request:
    paths:
      - "Launcher/**"
      - ".github/workflows/build-qube-launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Launcher/Qube2K23Launcher/Qube2K23Launcher.csproj --configuration Release
      - name: Publish single-file Windows executable
        if: github.event_name != 'pull_request'
        run: dotnet publish Launcher/Qube2K23Launcher/Qube2K23Launcher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload launcher
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: QUBE-2K23-Launcher-win-x64
          path: Launcher/Qube2K23Launcher/bin/Release/net8.0-windows/win-x64/publish/
